[tool.poetry]
name = "mootdx"
version = "0.12.0"
description = "通达信全量数据接入层 — 沪深A股行情/财务/板块/除权 + 期货/外汇扩展市场"
authors = ["bopo <ibopo@126.com>"]
readme = "README.md"
license = "MIT license"
homepage = "https://github.com/dare2live/tdxhub"
repository = "https://github.com/dare2live/tdxhub"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


[tool.poetry.scripts]
mootdx = "mootdx.__main__:entry"


[tool.poetry.dependencies]
python = "^3.9"
httpx = ">=0.25.0"
tenacity = ">=8.1.0"
tqdm = "*"
prettytable = {version = ">=3.5.0", optional = true}
click = {version = ">=8.1.3", optional = true}
mini-racer = {version = ">=0.12.0", optional = true}
typing-extensions = ">=4.5.0"

[tool.poetry.extras]
cli = ["click", "prettytable"]
racer = ["mini-racer"]

[tool.poetry.group.test.dependencies]
pytest-cov = "^4.0.0"
freezegun = "^1.2.2"
pytest = "^7.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-p no:warnings"
log_cli = 0
log_cli_level = "DEBUG"


[tool.commitizen]
tag_format = "v$version"
annotated_tag = true
changelog_file = "docs/history.md"
changelog_incremental = true
update_changelog_on_bump = true
version_provider = "poetry"
version_files = [
    "mootdx/__init__.py:__version__",
]


[tool.poe.tasks]
venv = "poetry install --sync --extras cli --extras racer"
lock = "poetry lock --no-update"

test = "poetry run pytest"
lint = "ruff check ./mootdx/*.py"

dist = "poetry build -v"
bump = "cz bump --yes -ch -cc --increment"

sync = "make sync"
pypi = "poetry publish --build --skip-existing"

#{MAJOR,MINOR,PATCH}
